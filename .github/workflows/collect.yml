name: Collect content
on:
  workflow_dispatch:
  # 12:00 JST every day. GitHub Actions cron is UTC.
  schedule: [{cron: '0 3 * * *'}]

concurrency:
  group: collect-content
  cancel-in-progress: false

jobs:
  collect:
    if: vars.POTOVER_PUBLICATION_READY == 'true' && vars.POTOVER_COLLECTION_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run collect:public-sources
      - run: npm run collect:gtowizard
      - run: npm run collect:youtube
      - name: Sync collected articles with D1 and export the canonical snapshot
        run: npm run sync:d1
        env:
          POTOVER_API_URL: https://potover-api.suuu-sh.workers.dev
          POTOVER_INGEST_TOKEN: ${{ secrets.POTOVER_INGEST_TOKEN }}
      - run: git config user.name 'github-actions[bot]'
      - run: git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: git add data/articles.json
      - run: |
          if ! git diff --cached --quiet; then
            git commit -m "chore: update collected content metadata"
          fi
      - run: git push
