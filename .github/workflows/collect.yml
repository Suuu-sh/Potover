name: Collect articles
on:
  workflow_dispatch:
  schedule: [{cron: '0 3 * * *'}]
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: echo 'Collector adapters run here after source terms/robots verification.'
